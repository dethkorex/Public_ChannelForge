name: Deploy global Creator Directory

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "directory/worker/**"
      - ".github/workflows/deploy-directory.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find or create production KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIGURED_KV_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          NO_COLOR: "1"
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          KV_ID="$CONFIGURED_KV_ID"
          cd directory/worker
          if [ -z "$KV_ID" ]; then
            npx --yes wrangler kv namespace list > "$RUNNER_TEMP/kv-list.json"
            KV_ID="$(python - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/kv-list.json', encoding='utf-8') as source:
              values = json.load(source)
          match = next((item for item in values if item.get('title') == 'channelforge-directory-CREATORS'), None)
          print(match.get('id', '') if match else '')
          PY
            )"
          fi
          if [ -z "$KV_ID" ]; then
            npx --yes wrangler kv namespace create CREATORS > "$RUNNER_TEMP/kv-create.txt"
            KV_ID="$(sed -n 's/.*id = "\([^"]*\)".*/\1/p' "$RUNNER_TEMP/kv-create.txt" | head -n 1)"
          fi
          test -n "$KV_ID"
          cd ../..
          sed -i "s/REPLACE_WITH_PRODUCTION_KV_ID/$KV_ID/" directory/worker/wrangler.toml
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: directory/worker
          command: deploy
