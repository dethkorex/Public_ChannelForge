name: Deploy global Creator Directory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure production KV namespace
        env:
          KV_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          test -n "$KV_ID"
          sed -i "s/REPLACE_WITH_PRODUCTION_KV_ID/$KV_ID/" directory/worker/wrangler.toml
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: directory/worker
          command: deploy
