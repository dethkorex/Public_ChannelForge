name: Build and release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "urllib3>=2.5,<3"
      - run: python -m unittest discover -s tests -v

  windows-installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - shell: powershell
        run: ./scripts/build_windows.ps1
      - shell: powershell
        run: Get-ChildItem release/*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { $_.Hash + "  " + (Split-Path $_.Path -Leaf) } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Public_ChannelForge-Windows
          path: release/*

  linux-installers:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        timeout-minutes: 3
        run: |
          if ! command -v zstd >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y zstd
          fi
      - name: Build Linux, Debian, Arch and Omarchy packages
        run: |
          chmod +x packaging/build_linux_packages.sh scripts/install_linux.sh scripts/uninstall_linux.sh
          VERSION="${GITHUB_REF_NAME#v}"
          packaging/build_linux_packages.sh "$VERSION"
      - name: Verify the portable suite from the release archive
        run: |
          PACKAGE_DIR="$(mktemp -d)"
          tar -xzf release/ChannelForge-*-linux-x64.tar.gz -C "$PACKAGE_DIR"
          cd "$PACKAGE_DIR/ChannelForge"
          bash -n install.sh
          bash -n uninstall.sh
          /usr/bin/python3 -Es Public_ChannelForge.py --help
          /usr/bin/python3 -Es -c 'import ChannelForge_TV; assert ChannelForge_TV.resource("web/hls.min.js").is_file()'
      - name: Inspect Debian package
        run: dpkg-deb --info release/Public_ChannelForge-*-linux-all.deb
      - name: Inspect Arch package
        run: tar --zstd -tf release/public-channelforge-*-any.pkg.tar.zst | grep -E 'usr/bin/(public-channelforge|channelforge-tv)|opt/public-channelforge/(Public_ChannelForge|ChannelForge_TV).py'
      - uses: actions/upload-artifact@v4
        with:
          name: Public_ChannelForge-Linux
          path: release/*

  fire-tv:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Fire TV viewer
        run: gradle -p tv/firetv :app:assembleRelease :app:lintRelease
      - name: Sign and verify the Fire TV APK
        env:
          CHANNELFORGE_TV_SIGNING: ${{ secrets.CHANNELFORGE_TV_SIGNING }}
        run: |
          mkdir -p tv-release
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          signing = json.loads(os.environ.pop("CHANNELFORGE_TV_SIGNING"))
          sdk_tools = Path(os.environ["ANDROID_HOME"]) / "build-tools"
          apksigner = sorted(sdk_tools.glob("*/apksigner"))[-1]
          apk = "tv-release/ChannelForgeTV-FireTV.apk"
          signing_env = {**os.environ, "CHANNELFORGE_STORE_PASSWORD": signing["password"]}
          fingerprint = "ac423e2c883afc9b7687f9a732504f632f9b9092e8280d6d5d00363ecfbcf5d8"
          with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as work:
              key = Path(work) / "channelforge-tv.p12"
              key.write_bytes(base64.b64decode(signing["keystore"], validate=True))
              key.chmod(0o600)
              certificate = subprocess.check_output([
                  "keytool", "-exportcert", "-keystore", key, "-storetype", "PKCS12",
                  "-alias", "channelforge-tv", "-storepass:env", "CHANNELFORGE_STORE_PASSWORD",
              ], env=signing_env)
              if hashlib.sha256(certificate).hexdigest() != fingerprint:
                  raise SystemExit("The Fire TV signing key does not match the release certificate.")
              subprocess.run([
                  apksigner, "sign", "--ks", key, "--ks-type", "PKCS12",
                  "--ks-key-alias", "channelforge-tv", "--ks-pass", "env:CHANNELFORGE_STORE_PASSWORD",
                  "--v4-signing-enabled", "false",
                  "--out", apk, "tv/firetv/app/build/outputs/apk/release/app-release-unsigned.apk",
              ], check=True, env=signing_env)
          subprocess.run([apksigner, "verify", "--print-certs", apk], check=True)
          PY
          sha256sum tv-release/ChannelForgeTV-FireTV.apk > tv-release/SHA256SUMS-TV.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ChannelForge-TV-FireTV
          path: tv-release/*

  roku:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Roku components
        run: npx --yes brighterscript@0.70.3 --root-dir tv/roku --create-package=false --copy-to-staging=false
      - name: Package Roku channel
        run: |
          mkdir -p tv-release
          cd tv/roku
          zip -r ../../tv-release/ChannelForgeTV-Roku.zip manifest source components images
          cd ../..
          sha256sum tv-release/ChannelForgeTV-Roku.zip > tv-release/SHA256SUMS-Roku.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ChannelForge-TV-Roku
          path: tv-release/*

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-installer, linux-installers, fire-tv, roku]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*ChannelForge*"
          path: release-assets
          merge-multiple: true
      - name: Verify complete release set
        run: |
          test -f release-assets/ChannelForge_Setup.exe
          test -f release-assets/SHA256SUMS.txt
          test -f release-assets/ChannelForgeTV-FireTV.apk
          test -f release-assets/SHA256SUMS-TV.txt
          test -f release-assets/ChannelForgeTV-Roku.zip
          test -f release-assets/SHA256SUMS-Roku.txt
          test -f release-assets/SHA256SUMS-Linux.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

