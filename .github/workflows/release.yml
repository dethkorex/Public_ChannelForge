name: Build and release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v

  windows-installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: choco install ffmpeg cloudflared -y --no-progress
      - shell: powershell
        run: ./scripts/build_windows.ps1
      - shell: powershell
        run: Get-ChildItem release/*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { $_.Hash + "  " + (Split-Path $_.Path -Leaf) } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Public_ChannelForge-Windows
          path: release/*

  linux-installers:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zstd ffmpeg
      - name: Build Linux, Debian, Arch and Omarchy packages
        run: |
          chmod +x packaging/build_linux_packages.sh scripts/install_linux.sh scripts/uninstall_linux.sh
          VERSION="${GITHUB_REF_NAME#v}"
          packaging/build_linux_packages.sh "$VERSION"
      - name: Test portable Linux installer
        run: |
          TEST_HOME="$RUNNER_TEMP/channel-forge-home"
          mkdir -p "$TEST_HOME"
          sudo apt-get install -y python3-webview
          HOME="$TEST_HOME" XDG_DATA_HOME="$TEST_HOME/.local/share" XDG_CONFIG_HOME="$TEST_HOME/.config" bash scripts/install_linux.sh
          HOME="$TEST_HOME" XDG_DATA_HOME="$TEST_HOME/.local/share" XDG_CONFIG_HOME="$TEST_HOME/.config" "$TEST_HOME/.local/bin/public-channelforge" --help
          test -x "$TEST_HOME/.local/bin/channelforge-tv"
          test -f "$TEST_HOME/.local/share/applications/channelforge-tv.desktop"
      - name: Inspect Debian package
        run: dpkg-deb --info release/Public_ChannelForge-*-linux-all.deb
      - name: Inspect Arch package
        run: tar --zstd -tf release/public-channelforge-*-any.pkg.tar.zst | grep -E 'usr/bin/(public-channelforge|channelforge-tv)|opt/public-channelforge/(Public_ChannelForge|ChannelForge_TV).py'
      - uses: actions/upload-artifact@v4
        with:
          name: Public_ChannelForge-Linux
          path: release/*

  fire-tv:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build installable Fire TV APK
        run: |
          gradle -p tv/firetv :app:assembleDebug
          mkdir -p tv-release
          cp tv/firetv/app/build/outputs/apk/debug/app-debug.apk tv-release/ChannelForgeTV-FireTV.apk
          sha256sum tv-release/ChannelForgeTV-FireTV.apk > tv-release/SHA256SUMS-TV.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ChannelForge-TV-FireTV
          path: tv-release/*

  roku:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Roku channel
        run: |
          mkdir -p tv-release
          cd tv/roku
          zip -r ../../tv-release/ChannelForgeTV-Roku.zip manifest source components images
          cd ../..
          sha256sum tv-release/ChannelForgeTV-Roku.zip > tv-release/SHA256SUMS-Roku.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ChannelForge-TV-Roku
          path: tv-release/*

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-installer, linux-installers, fire-tv, roku]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*ChannelForge*"
          path: release-assets
          merge-multiple: true
      - name: Verify complete release set
        run: |
          test -f release-assets/ChannelForge_Setup.exe
          test -f release-assets/SHA256SUMS.txt
          test -f release-assets/ChannelForgeTV-FireTV.apk
          test -f release-assets/SHA256SUMS-TV.txt
          test -f release-assets/ChannelForgeTV-Roku.zip
          test -f release-assets/SHA256SUMS-Roku.txt
          test -f release-assets/SHA256SUMS-Linux.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

