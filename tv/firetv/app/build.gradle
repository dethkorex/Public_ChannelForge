plugins { id 'com.android.application' }

android {
    namespace 'tv.channelforge.viewer'
    compileSdk 35
    defaultConfig {
        applicationId 'tv.channelforge.viewer'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'DIRECTORY_URL', '"https://directory.channelforge.tv/v1/catalog"'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release { minifyEnabled false }
    }
}
