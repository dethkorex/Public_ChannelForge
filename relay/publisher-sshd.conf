# Dedicated Studio transport. The system administrator's sshd uses its own settings.
Port 18088
ListenAddress 127.0.0.1
ListenAddress ::
HostKey /etc/ssh/ssh_host_ed25519_key
AllowUsers channelforge-relay
AuthorizedKeysFile /var/lib/channelforge-enrollment/authorized_keys
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
UsePAM yes
PermitRootLogin no
PermitTTY no
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
AllowTcpForwarding remote
GatewayPorts no
PermitListen 127.0.0.1:*
MaxSessions 0
LoginGraceTime 15
MaxStartups 20:30:80
ClientAliveInterval 15
ClientAliveCountMax 2
