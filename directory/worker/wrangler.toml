name = "channelforge-directory"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[durable_objects.bindings]]
name = "STUDIO_INDEX"
class_name = "StudioIndex"

[[migrations]]
tag = "studio-index-v1"
new_sqlite_classes = ["StudioIndex"]

[[kv_namespaces]]
binding = "CREATORS"
id = "6e554e6b39ca49e7abda650fe56dab8e"

[triggers]
crons = ["*/2 * * * *"]

[vars]
OFFLINE_AFTER_SECONDS = "360"
